name: brave
display_name: Brave Search API
signup_url: https://api.search.brave.com/register
api_key_url: https://api.search.brave.com/app/keys
env_var: BRAVE_API_KEY
category: search
difficulty: easy
free_tier: "2,000 queries/month free"
docs_url: https://api.search.brave.com/app/documentation

has_email_verification: true
has_captcha: false
has_phone_verification: false
requires_credit_card: false

signup_email_selector: 'input[name="email"], input[type="email"]'
signup_password_selector: 'input[name="password"], input[type="password"]'
signup_submit_selector: 'button[type="submit"]'

api_key_selector: 'code, input[readonly], .api-key'
api_key_pattern: 'BSA[a-zA-Z0-9_\-]{20,}'
