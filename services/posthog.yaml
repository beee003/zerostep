name: posthog
display_name: PostHog
signup_url: https://app.posthog.com/signup
api_key_url: https://app.posthog.com/project/settings
env_var: POSTHOG_API_KEY
category: analytics
difficulty: easy
free_tier: "1M events/month free"
docs_url: https://posthog.com/docs

has_email_verification: true
has_captcha: false
has_phone_verification: false
requires_credit_card: false

supports_google: true
supports_github: true
google_button_selector: 'button:has-text("Google"), a:has-text("Sign up with Google")'
github_button_selector: 'button:has-text("GitHub"), a:has-text("Sign up with GitHub")'

signup_email_selector: 'input[name="email"], input[type="email"]'
signup_password_selector: 'input[name="password"], input[type="password"]'
signup_name_selector: 'input[name="name"], input[name="first_name"]'
signup_submit_selector: 'button[type="submit"]'

api_key_selector: 'code, [data-attr="project-api-key"]'
api_key_pattern: 'phc_[a-zA-Z0-9]{20,}'

post_signup_steps:
  - action: wait
    value: "3"
